<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="520" viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RTSP streaming architecture flow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f8fb"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a4b66"/>
    </marker>
    <style>
      .title { font: 700 22px 'Georgia', 'Times New Roman', serif; fill: #1e2a3a; }
      .label { font: 600 16px 'Georgia', 'Times New Roman', serif; fill: #1e2a3a; }
      .note  { font: 400 13px 'Georgia', 'Times New Roman', serif; fill: #4b5a6a; }
      .box   { fill: #ffffff; stroke: #c9d4e3; stroke-width: 2; rx: 12; }
      .accent { fill: #f5f7fb; }
      .line  { stroke: #3a4b66; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .line-dashed { stroke: #3a4b66; stroke-width: 2; fill: none; stroke-dasharray: 6 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="520" fill="url(#bg)"/>

  <text x="40" y="50" class="title">RTSP 串流實際架構（單路攝影機輸入）</text>

  <!-- Camera -->
  <rect x="60" y="130" width="180" height="90" class="box" filter="url(#shadow)"/>
  <text x="150" y="170" text-anchor="middle" class="label">[A] 攝影機</text>
  <text x="150" y="192" text-anchor="middle" class="note">RTSP source</text>

  <!-- MediaMTX -->
  <rect x="360" y="110" width="220" height="130" class="box" filter="url(#shadow)"/>
  <rect x="360" y="110" width="220" height="26" class="box accent"/>
  <text x="470" y="130" text-anchor="middle" class="note">Docker</text>
  <text x="470" y="170" text-anchor="middle" class="label">[M] MediaMTX</text>
  <text x="470" y="192" text-anchor="middle" class="note">分流 / 低延遲</text>

  <!-- Frontend -->
  <rect x="700" y="120" width="210" height="110" class="box" filter="url(#shadow)"/>
  <text x="805" y="165" text-anchor="middle" class="label">前端 UI</text>
  <text x="805" y="188" text-anchor="middle" class="note">WebRTC 播放</text>

  <!-- Backend -->
  <rect x="360" y="320" width="220" height="120" class="box" filter="url(#shadow)"/>
  <text x="470" y="362" text-anchor="middle" class="label">後端 AI / Vision</text>
  <text x="470" y="385" text-anchor="middle" class="note">從 MediaMTX 拉 RTSP</text>

  <!-- JSON Output -->
  <rect x="700" y="330" width="210" height="100" class="box" filter="url(#shadow)"/>
  <text x="805" y="368" text-anchor="middle" class="label">[B] JSON</text>
  <text x="805" y="392" text-anchor="middle" class="note">box / pose / object</text>

  <!-- Lines -->
  <path d="M 240 175 L 360 175" class="line"/>
  <text x="300" y="160" text-anchor="middle" class="note">RTSP</text>

  <path d="M 580 175 L 700 175" class="line"/>
  <text x="640" y="160" text-anchor="middle" class="note">WebRTC</text>

  <path d="M 470 240 L 470 320" class="line-dashed"/>
  <text x="515" y="288" text-anchor="start" class="note">RTSP（內網）</text>

  <path d="M 580 380 L 700 380" class="line"/>
  <text x="640" y="365" text-anchor="middle" class="note">偵測結果</text>

  <path d="M 805 330 L 805 230" class="line"/>
  <text x="825" y="280" text-anchor="start" class="note">疊圖顯示</text>

  <!-- Footer note -->
  <text x="40" y="490" class="note">前端畫面 = MediaMTX 串流畫面 + [B] 偵測疊圖</text>
</svg>
